# =======================================================
# FindIt - Spring Boot Application Configuration
# =======================================================
server.port=${SERVER_PORT:8080}
spring.application.name=findit-backend

# =======================================================
# Database Configuration (MySQL)
# Configurable via environment variables with safe defaults
# =======================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/findit_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# =======================================================
# JPA / Hibernate Configuration
# =======================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =======================================================
# Security & JWT Configuration
# =======================================================
security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
security.jwt.expiration-time=${JWT_EXPIRATION:86400000}

# =======================================================
# CORS Configuration
# =======================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# =======================================================
# File Upload Configuration
# =======================================================
app.upload.dir=${APP_UPLOAD_DIR:uploads/items}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
