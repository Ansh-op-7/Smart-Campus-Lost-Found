# In-memory H2 database for test execution
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Test Security & JWT Configuration
security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
security.jwt.expiration-time=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Test Upload Configuration
app.upload.dir=target/test-uploads/items
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
